services:
  wapydev-db:
    container_name: wapydev-db
    image: postgres:17.2
    restart: unless-stopped
    environment:
      - POSTGRES_USER=wapydev
      - POSTGRES_PASSWORD=wapydev
      - POSTGRES_DB=wapydev
    ports:
      - '5432:5432'
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

      
  wapydev-app:
    container_name: wapydev-app
    image: ghcr.io/meceware/wapy.dev:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      - wapydev-db

  wapydev-cron:
    container_name: wapydev-cron
    image: alpine:3.21
    restart: unless-stopped
    command: >
      sh -c 'while true; do
        /usr/bin/flock -n /tmp/wapy.lockfile wget -qO- wapydev-app:3000/api/cron/;
        sleep 60;
      done'
    depends_on:
      - wapydev-app
